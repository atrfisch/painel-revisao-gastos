name: Backfill mensal

# Monta o histórico mensal por ação, que é o que permite comparar o acumulado
# de hoje com o acumulado do mesmo período do ano anterior.
# Rode uma vez ao montar o painel e depois todo dia 15, quando o Portal da
# Transparência já publicou o mês fechado.

on:
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos a baixar, separados por vírgula"
        required: false
        default: ""
  schedule:
    - cron: "0 9 15 * *"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::readr
            any::stringr
            any::purrr

      - name: Rodar o backfill
        env:
          ANOS_BACKFILL: ${{ github.event.inputs.anos }}
        run: Rscript R/backfill_mensal.R

      - name: Publicar histórico
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico
          if git diff --staged --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Histórico mensal — $(date -u +'%Y-%m-%d')"
            git push
          fi
