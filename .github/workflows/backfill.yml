name: Backfill mensal

# Monta o histórico mensal por ação, que é o que permite comparar o acumulado
# de hoje com o acumulado do mesmo período do ano anterior.
# Rode uma vez ao montar o painel e depois todo dia 15, quando o Portal da
# Transparência já publicou o mês fechado.

on:
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos a baixar, separados por vírgula"
        required: false
        default: ""
  schedule:
    - cron: "0 9 15 * *"

permissions:
  contents: write

env:
  R_LIBS_USER: /home/runner/rlib
  REPO_CRAN: https://packagemanager.posit.co/cran/__linux__/jammy/latest

jobs:
  backfill:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true

      - name: Reaproveitar pacotes já instalados
        uses: actions/cache@v4
        with:
          path: /home/runner/rlib
          key: rlib-jammy-4.4.3-v1

      - name: Instalar pacotes de R
        shell: Rscript {0}
        run: |
          lib <- Sys.getenv("R_LIBS_USER")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          .libPaths(lib)
          options(repos = c(CRAN = Sys.getenv("REPO_CRAN")), timeout = 900)
          pacotes <- c("dplyr", "tidyr", "readr", "stringr", "purrr")
          faltando <- setdiff(pacotes, rownames(installed.packages(lib.loc = lib)))
          if (length(faltando)) install.packages(faltando, lib = lib)
          cat("Pacotes prontos.\n")

      - name: Rodar o backfill
        env:
          ANOS_BACKFILL: ${{ github.event.inputs.anos }}
        run: Rscript R/backfill_mensal.R

      - name: Publicar histórico
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico
          if git diff --staged --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Histórico mensal — $(date -u +'%Y-%m-%d')"
            git push
          fi
