name: Atualizar painel

on:
  schedule:
    # 08:20 UTC = 05:20 em Brasília, depois da carga noturna do SIOP
    - cron: "20 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

env:
  # Biblioteca de pacotes fora da árvore do repositório, para não entrar em commit
  R_LIBS_USER: /home/runner/rlib
  # Espelho da Posit com binários para o Ubuntu jammy
  REPO_CRAN: https://packagemanager.posit.co/cran/__linux__/jammy/latest

jobs:
  atualizar:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # Versão fixa e imagem fixa: pedir "release" no ubuntu-latest quebra
          # sempre que o runner muda de versão do Ubuntu antes de o R ter
          # pacote publicado para ela.
          r-version: "4.4.3"
          use-public-rspm: true

      - name: Reaproveitar pacotes já instalados
        uses: actions/cache@v4
        with:
          path: /home/runner/rlib
          key: rlib-jammy-4.4.3-v1

      - name: Instalar pacotes de R
        shell: Rscript {0}
        run: |
          lib <- Sys.getenv("R_LIBS_USER")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          .libPaths(lib)
          options(repos = c(CRAN = Sys.getenv("REPO_CRAN")), timeout = 900)
          pacotes <- c("orcamentoBR", "dplyr", "tidyr", "readr",
                       "stringr", "lubridate", "jsonlite", "purrr")
          faltando <- setdiff(pacotes, rownames(installed.packages(lib.loc = lib)))
          if (length(faltando)) install.packages(faltando, lib = lib)
          for (p in pacotes) library(p, character.only = TRUE, lib.loc = lib)
          cat("Pacotes prontos.\n")

      - name: Rodar o pipeline
        run: Rscript R/pipeline.R

      - name: Publicar resultados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dados historico
          if git diff --staged --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "Atualização automática — $(date -u +'%Y-%m-%d')"
            git push
          fi
