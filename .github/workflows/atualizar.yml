name: Atualizar painel

on:
  schedule:
    # 08:20 UTC = 05:20 em Brasília, depois da carga noturna do SIOP
    - cron: "20 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # Versão fixa e imagem fixa: pedir "release" no ubuntu-latest quebra
          # sempre que o runner muda de versão do Ubuntu antes de o R ter
          # pacote publicado para ela.
          r-version: "4.4.3"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::orcamentoBR
            any::dplyr
            any::tidyr
            any::readr
            any::stringr
            any::lubridate
            any::jsonlite
            any::purrr

      - name: Rodar o pipeline
        env:
          # Taxa de crescimento real de referência do Regime Fiscal Sustentável
          # para o exercício. A banda da LC 200/2023 vai de 0,006 a 0,025.
          RFS_TAXA: "0.025"
        run: Rscript R/pipeline.R

      - name: Publicar resultados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dados historico
          if git diff --staged --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "Atualização automática — $(date -u +'%Y-%m-%d')"
            git push
          fi
